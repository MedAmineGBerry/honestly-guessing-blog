<header id="title-block-header" class="quarto-title-block default sleeve-$if(sleeve)$$sleeve$$else$mustard$endif$">
<div class="quarto-title">
<div class="title-text">
<h1 class="title">$title$</h1>
$if(subtitle)$
<p class="subtitle lead">$subtitle$</p>
$endif$
<p class="label">$if(opus)$Op. $opus$ / $endif$$date$</p>
</div>
$if(verdict)$
<div class="sticker"><span class="label">The verdict</span><span class="sticker-text">$verdict$</span></div>
$endif$
</div>
</header>
