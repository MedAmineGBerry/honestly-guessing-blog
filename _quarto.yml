project:
  type: website
  output-dir: docs   # rendered here, then pushed to the branch gh-pages by "quarto publish"
  resources:
    - "posts/soulmates/deck.html"

website:
  title: "Honestly Guessing"
  description: "We all grew up with sayings that either gave us hope or held us back. Now that I work with data, I hope to bring some clarity to folk wisdom, and to learn from it in return."
  site-url: https://medaminegberry.github.io/honestly-guessing-blog
  navbar:
    pinned: true   # the name and the stripes stay in place while the page scrolls
    right:
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/MedAmineGBerry
        aria-label: GitHub

format:
  html:
    theme: [default, theme.scss]   # the default theme loads no fonts from other servers
    toc: true
    link-external-newwindow: true
    html-math-method: plain   # no maths library from another server; a post that needs one can switch it on
